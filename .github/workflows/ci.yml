name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  rust:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: "false"

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # Fetch the pinned real-world CMake corpus (Abseil, Catch2, etc.
      # — see tests/fixtures/real_world/manifest.toml) so the
      # `tests/real_world.rs` checks exercise actual upstream
      # CMakeLists.txt files on every PR, not just on the weekly
      # cron in real-world.yml. The fetch is cheap (~1 MB total) and
      # SHA-pinned; Linux-only because the corpus content is
      # platform-independent and the existing skip-when-absent
      # behaviour in real_world.rs handles the other matrix legs
      # gracefully.
      - name: Set up Python (for corpus fetcher)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"

      - name: Fetch real-world CMake corpus
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/fetch-real-world-corpus.py

      - name: Test
        run: cargo test

      - name: Build API docs
        run: cargo doc --no-deps

      - name: Install cargo-audit
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29  # v2.87.21
        with:
          tool: cargo-audit

      - name: Security audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo audit

      - name: Install cargo-deny
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29  # v2.87.21
        with:
          tool: cargo-deny

      - name: Dependency licences, bans, and advisories
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny --all-features check

      - name: Check JSON schema is up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --quiet -- config schema > /tmp/schema.json
          diff docs/public/schemas/latest/schema.json /tmp/schema.json || \
            (echo "Schema is out of date — run 'cmakefmt config schema' and commit the result" && exit 1)

  dprint:
    name: dprint plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install dprint
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: dprint

      - name: Test plugin adapter
        run: "cargo test --locked --features dprint-plugin --lib dprint::"

      - name: Build WebAssembly plugin
        run: bash scripts/build-dprint-plugin.sh

      - name: Test plugin in dprint
        run: bash scripts/test-dprint-plugin.sh

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable action, pinned toolchain below
        with:
          toolchain: "1.88"

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: "false"
          # Use a separate cache key from the stable-toolchain rust job so
          # they don't fight over the same target/ directory contents.
          key: msrv

      - name: Check at MSRV
        # `cargo check` (not `cargo build`/`cargo test`) is sufficient: we
        # only need to confirm the source still type-checks at the floor
        # declared in `Cargo.toml`'s `rust-version`. The stable-toolchain
        # job above already exercises the full build+test path.
        run: cargo check --locked --all-features --all-targets

  sarif:
    name: sarif
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: false
          cache-bin: "false"

      - name: Install clippy-sarif and sarif-fmt
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29  # v2.87.21
        with:
          tool: clippy-sarif,sarif-fmt

      - name: Run Clippy and emit SARIF
        shell: bash
        run: |
          cargo clippy --all-targets --message-format=json \
            | clippy-sarif \
            | tee clippy.sarif \
            | sarif-fmt
        continue-on-error: true

      - name: Upload Clippy SARIF to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          sarif_file: clippy.sarif
