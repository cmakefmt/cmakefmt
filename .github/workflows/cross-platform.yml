name: Cross-Platform Output Consistency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cross-platform.yml'
      - 'scripts/capture-cross-platform-output.py'
      - 'build.rs'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'src/**'
      - 'tests/fixtures/**'
  pull_request:
    paths:
      - '.github/workflows/cross-platform.yml'
      - 'scripts/capture-cross-platform-output.py'
      - 'build.rs'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'src/**'
      - 'tests/fixtures/**'

permissions: read-all

jobs:
  format-output:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable

      - name: Build
        run: cargo build --release

      - name: Format fixtures and capture output
        shell: bash
        run: |
          binary=./target/release/cmakefmt
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          python scripts/capture-cross-platform-output.py "$binary"

      - name: Upload output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: output-${{ matrix.os }}
          path: cross-platform-output.txt

  compare:
    needs: format-output
    runs-on: ubuntu-latest
    steps:
      - name: Download all outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2

      - name: Compare outputs
        run: |
          diff output-ubuntu-latest/cross-platform-output.txt \
               output-macos-latest/cross-platform-output.txt \
            || { echo "::error::Linux and macOS outputs differ"; exit 1; }
          diff output-ubuntu-latest/cross-platform-output.txt \
               output-windows-latest/cross-platform-output.txt \
            || { echo "::error::Linux and Windows outputs differ"; exit 1; }
          echo "All platforms produce identical output"
