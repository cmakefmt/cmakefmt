name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docker.yml'
      - '.dockerignore'
      - 'build.rs'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'Dockerfile'
      - 'src/**'
  pull_request:
    paths:
      - '.github/workflows/docker.yml'
      - '.dockerignore'
      - 'build.rs'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'Dockerfile'
      - 'src/**'

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build Docker image
        run: docker build -t cmakefmt-test .

      - name: Verify binary runs
        run: |
          docker run --rm cmakefmt-test --version
          docker run --rm cmakefmt-test --help

      - name: Format a CMake file
        run: |
          echo 'CMAKE_MINIMUM_REQUIRED(VERSION 3.20)' | \
            docker run --rm -i cmakefmt-test - | \
            grep -q 'cmake_minimum_required'
